name: reacher
eval_config: reacher
data_root: ${data.root}/reacher
dataset_name: dmc/reacher_random
raw_h5: ${task.data_root}/reacher.h5
split_train_root: ${task.data_root}/splits/reacher_random_train
split_test_root: ${task.data_root}/splits/reacher_random_test
split_train_h5: ${task.split_train_root}/dmc/reacher_random.h5
split_test_h5: ${task.split_test_root}/dmc/reacher_random.h5
planner_dataset_path: ${pipeline.output_root}/reacher_planner_dataset.pt
anchor_bundle_path: ${pipeline.output_root}/reacher_action_anchors_k${anchors.num_anchors}_kmeans_nearest.pt
train_output_dir: ${pipeline.output_root}/reacher_diffusion_k${anchors.num_anchors}_${pipeline.num_samples}
wm_policy: ${task.data_root}/lewm_epoch_29
episode_key: auto
download_if_missing: false
download:
  url: https://hf-mirror.com/datasets/quentinll/lewm-reacher/resolve/main/reacher.tar.zst
  archive_type: tar.zst
  output: ${task.data_root}/reacher.tar.zst

evaluation:
  enabled: true
  dataset_h5: ${task.split_test_h5}
  cache_dir: ${task.split_test_root}
